<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>ФАП — воздушное законодательство</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f8fafc;--fg:#0f172a;--mut:#64748b;--card:#fff;--line:#e2e8f0;--acc:#0284c7;--hl:#fde68a;--fs:17px}
:root.dark{--bg:#0b1220;--fg:#e2e8f0;--mut:#94a3b8;--card:#111a2e;--line:#1e293b;--acc:#38bdf8;--hl:#854d0e}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;gap:10px;align-items:center}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer}
button.icon{border:none;font-size:20px;padding:4px 8px}
input[type=search]{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg)}
main{max-width:860px;margin:0 auto;padding:12px 14px 90px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs button{flex:1;border:none;border-radius:0;padding:10px 4px;font-size:13px;color:var(--mut)}nav.tabs button.on{color:var(--acc);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0;cursor:pointer}
.card .t{font-weight:600}.card .s{color:var(--mut);font-size:13px;margin-top:4px}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:#0ea5e933;color:var(--acc);margin-right:6px}
.badge.warn{background:#f59e0b33;color:#b45309}.badge.red{background:#ef444433;color:#dc2626}
.star{float:right;font-size:20px;border:none;padding:0 4px}
.banner{background:#0284c71a;border:1px solid var(--acc);border-radius:12px;padding:10px 12px;margin:10px 0}
#docText{font-size:var(--fs);line-height:1.6;white-space:pre-wrap;word-wrap:break-word;font-family:Georgia,"Times New Roman",serif}
#docText h3{font:700 1.05em system-ui,sans-serif;margin:1.2em 0 .4em;white-space:normal}
mark{background:var(--hl);color:inherit}mark.cur{outline:2px solid var(--acc)}
.toolbar{position:sticky;top:56px;z-index:4;background:var(--bg);padding:8px 0;display:flex;gap:6px;align-items:center}
.toolbar input{flex:1}.muted{color:var(--mut);font-size:13px}
.toc a{display:block;padding:6px 0;color:var(--acc);text-decoration:none;border-bottom:1px solid var(--line)}
.snip{font-size:14px;color:var(--mut);margin-top:6px}.snip b{color:var(--fg);background:var(--hl)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg);max-width:92vw;width:640px;max-height:80vh}
.hidden{display:none!important}
</style>
</head>
<body>
<header><button class="icon hidden" id="back" aria-label="Назад">←</button><h1 id="title">ФАП</h1><button class="icon" id="theme" aria-label="Тема">◐</button></header>
<main id="view"></main>
<nav class="tabs"><button data-tab="docs" class="on">Документы</button><button data-tab="fav">Избранное</button><button data-tab="search">Поиск</button><button data-tab="updates">Обновления</button><button data-tab="about">О базе</button></nav>
<dialog id="tocDlg"><div id="tocBody" class="toc"></div><p><button onclick="tocDlg.close()">Закрыть</button></p></dialog>
<script src="app.js"></script>
</body>
</html>
