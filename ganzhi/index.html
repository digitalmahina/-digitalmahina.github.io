    <style>
      /* Element palettes from the original page, following the theme */
      .elem-0, .elem-1 { --ef: light-dark(#eaf3de, #173404); --es: light-dark(#639922, #97c459); --et: light-dark(#27500a, #c0dd97); }
      .elem-2, .elem-3 { --ef: light-dark(#faece7, #4a1b0c); --es: light-dark(#993c1d, #f0997b); --et: light-dark(#711313, #f5c4b3); }
      .elem-4, .elem-5 { --ef: light-dark(#faeeda, #412402); --es: light-dark(#854f0b, #ef9f27); --et: light-dark(#633806, #fac775); }
      .elem-6, .elem-7 { --ef: light-dark(#f1efe8, #2c2c2a); --es: light-dark(#5f5e5a, #b4b2a9); --et: light-dark(#444441, #d3d1c7); }
      .elem-8, .elem-9 { --ef: light-dark(#e6f1fb, #042c53); --es: light-dark(#185fa5, #85b7eb); --et: light-dark(#0c447c, #b5d4f4); }
      :root {
        --x-ts: #888780;
        --x-bt: light-dark(rgba(0, 0, 0, 0.22), rgba(255, 255, 255, 0.22));
        /* Type scale, ratio 1.25: 12 / 15 / 19 / 24, line heights on the 8px grid */
        --x-t12: var(--weight-regular) 12px/16px var(--sans);
        --x-t12m: var(--weight-medium) 12px/16px var(--sans);
        --x-t15: var(--weight-regular) 15px/24px var(--sans);
        --x-t15m: var(--weight-medium) 15px/24px var(--sans);
        --x-t19: var(--weight-medium) 19px/24px var(--sans);
        --x-t24: var(--weight-regular) 24px/32px var(--sans);
      }

      /* Six-ring stack */
      .x-rings { position: relative; aspect-ratio: 1; user-select: none; -webkit-user-select: none; contain: layout style paint; }
      .x-rings svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; pointer-events: none; shape-rendering: geometricPrecision; }
      .x-rings svg text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

      /* Splash */
      .x-splash {
        position: fixed; inset: 0; z-index: 9000;
        /* rings block S = min(screen width − 48, available height − 168) */
        --S: min(calc(100vw - 48px), calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 168px));
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: env(safe-area-inset-top, 0px) 24px calc(24px + env(safe-area-inset-bottom, 0px));
        background: var(--fill-primary-on); overflow: hidden;
      }
      .x-splash[hidden] { display: none; }
      .x-wordmark { font: var(--x-t12m); letter-spacing: 0.32em; margin-right: -0.32em; color: var(--text-primary); }
      /* logo = 0.07·S; wordmark cap height (0.7em in Geist) = the logo's inner diameter (0.837 of its size) */
      .x-splash__brand { display: flex; align-items: center; gap: 8px; height: calc(var(--S) * 0.07); margin-bottom: 16px; }
      .x-splash__brand .x-logo { --ls: calc(var(--S) * 0.07); }
      .x-splash__brand .x-wordmark { font-size: calc(var(--S) * 0.07 * 0.837 / 0.7); line-height: 1; letter-spacing: 0.24em; margin-right: -0.24em; text-box: trim-both cap alphabetic; }
      .x-splash__rings { width: var(--S); height: var(--S); flex: none; cursor: pointer; border-radius: 50%; }

      /* Daily ring logo */
      :root { --x-logo-t: light-dark(#444441, #d3d1c7); }
      .x-logo { --ls: 24px; display: inline-block; width: var(--ls); height: var(--ls); flex: none; line-height: 0; }
      .x-logo svg { width: 100%; height: 100%; display: block; overflow: visible; }
      .x-brand { display: inline-flex; align-items: center; gap: 8px; }
      .x-brand--stack { flex-direction: column; gap: 6px; }

      /* Note colour swatches */
      .x-swatches { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); }
      .x-swatches label { position: relative; height: 40px; display: grid; place-items: center; cursor: pointer; }
      .x-swatches input { position: absolute; opacity: 0; width: 1px; height: 1px; }
      .x-swatches span { width: 24px; height: 24px; border-radius: 50%; background: var(--pc); }
      .x-swatches input:checked + span { box-shadow: 0 0 0 2px var(--fill-primary-on), 0 0 0 4px var(--text-primary); }
      .x-swatches input:focus-visible + span { outline: 2px solid var(--fill-primary); outline-offset: 4px; }
      .x-splash__rings:focus-visible { outline-offset: -8px; }
      .x-splash__line { flex: none; margin: 24px 0 0; font: var(--x-t12); font-size: 12px; color: var(--text-secondary); opacity: 1; text-align: center; text-wrap: balance; }

      /* No motion anywhere */
      html { scroll-behavior: auto !important; }
      *, *::before, *::after { animation: none !important; transition: none !important; }

      /* Phone frame */
      /* Phone frame: true 390:844, centred in the viewport */
      .x-phone {
        --ph: min(844px, calc(100dvh - 48px));
        position: fixed; inset: 0; z-index: 10; margin: auto;
        height: var(--ph); width: min(calc(var(--ph) * 390 / 844), calc(100vw - 32px));
        display: flex; flex-direction: column; overflow: hidden;
        font: var(--x-t15); color: var(--text-primary);
        background: var(--fill-primary-on); border: 1px solid var(--stroke-primary); border-radius: var(--r-xl); box-shadow: var(--hark-shadow);
      }
      .x-phone[hidden] { display: none; }
      @media (max-width: 480px) {
        .x-phone { width: 100vw; height: 100dvh; border: 0; border-radius: 0; box-shadow: none; }
      }
      .x-phone p, .x-phone h1, .x-phone h3 { margin: 0; overflow-wrap: anywhere; }
      .x-screen { flex: 1; min-height: 0; min-width: 0; overflow-y: auto; overflow-x: hidden; padding: 0 16px 24px; display: none; flex-direction: column; gap: 16px; overscroll-behavior: contain; }
      .x-screen.is-active { display: flex; }
      .x-top { position: sticky; top: 0; z-index: 2; flex: none; height: 48px; margin-inline: -16px; padding-inline: 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--fill-primary-on); }
      .x-top .x-logo { --ls: 24px; }
      .x-h1 { font: var(--x-t24); }
      .x-sub { font: var(--x-t15); color: var(--text-secondary); }
      .x-cap { font: var(--x-t12); color: var(--text-secondary); }
      .x-label { font: var(--x-t12m); color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.06em; }
      .x-help { appearance: none; border: 0; background: none; width: var(--tap); height: var(--tap); margin-right: -10px; display: grid; place-items: center; cursor: pointer; color: var(--text-secondary); }
      .x-help span { width: 24px; height: 24px; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--stroke-primary); display: grid; place-items: center; font: var(--x-t12m); }
      .x-help:hover span { color: var(--text-primary); }

      /* Tab bar: 56px + safe area, equal tabs, a 4px dot above the active icon */
      .x-tabs { flex: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); height: calc(56px + env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); border-top: 1px solid var(--stroke-secondary); background: var(--fill-primary-on); }
      .x-tabs[hidden] { display: none; }
      .x-tab { appearance: none; border: 0; background: none; color: var(--text-secondary); font: var(--x-t12); height: 56px; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0; cursor: pointer; }
      .x-tab::before { content: ""; width: 4px; height: 4px; margin-bottom: 4px; border-radius: 50%; background: transparent; }
      .x-tab svg { width: 22px; height: 22px; display: block; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .x-tab span { margin-top: 4px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .x-tab[aria-current="page"] { color: var(--text-primary); }
      .x-tab[aria-current="page"]::before { background: var(--text-primary); }
      .x-tab:focus-visible { outline: 2px solid var(--fill-primary); outline-offset: -4px; border-radius: var(--r-s); }

      /* Cards and rows */
      .x-card { background: var(--fill-tertiary); border-radius: var(--r-s); padding: 16px; display: grid; gap: 8px; min-width: 0; }
      .x-card--link { cursor: pointer; }
      .x-day { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font: var(--x-t12); color: var(--text-secondary); }
      .x-elem { display: inline-flex; align-items: center; gap: 8px; height: 24px; padding: 0 8px; border-radius: var(--r-pill); background: var(--ef); color: var(--et); font: var(--x-t12m); }
      .x-elem::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--es); }
      .x-edot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--es); flex: none; }
      .x-av { --s: 32px; width: var(--s); height: var(--s); flex: none; border-radius: 50%; display: inline-grid; place-items: center; background: var(--ef); color: var(--et); box-shadow: inset 0 0 0 1.5px var(--es); font: var(--weight-bold) calc(var(--s) * 0.375) / 1 var(--sans); }
      .x-entries { display: grid; }
      .x-entry { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; padding: 16px 0; border-top: 1px solid var(--stroke-secondary); }
      .x-entry:first-child { border-top: 0; padding-top: 0; }
      .x-entry:last-child { padding-bottom: 0; }
      .x-entry__name { font: var(--x-t15m); }
      .x-entry__name small { font: var(--x-t12); color: var(--text-secondary); }
      .x-entry__text { font: var(--x-t15); }
      .x-empty { font: var(--x-t15); color: var(--text-secondary); }

      .x-textarea, .x-input { width: 100%; font: var(--x-t15); color: var(--text-primary); background: var(--fill-primary-on); border: 1px solid var(--stroke-primary); border-radius: var(--r-s); padding: 8px 16px; }
      .x-textarea { min-height: 96px; resize: vertical; }
      .x-input { height: var(--tap); }
      .x-textarea:focus, .x-input:focus { outline: 2px solid var(--fill-primary); outline-offset: 1px; }
      .x-primary { appearance: none; border: 0; cursor: pointer; min-height: var(--tap); padding: 0 16px; border-radius: var(--r-s); background: var(--fill-primary); color: var(--text-primary-on); font: var(--x-t15m); }
      .x-primary:disabled { opacity: 0.4; cursor: default; }
      .x-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
      .x-row--between { justify-content: space-between; }
      button.btn { cursor: pointer; }

      /* Parallel feed */
      .x-feeddays { display: grid; gap: 16px; }
      .x-feedday { display: grid; gap: 8px; padding-top: 16px; border-top: 1px solid var(--stroke-primary); }
      .x-feedday:first-child { border-top: 0; padding-top: 0; }
      .x-par { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .x-lane { background: var(--fill-tertiary); border-radius: var(--r-s); padding: 16px; display: grid; gap: 8px; align-content: start; min-width: 0; }
      .x-lane__head { display: grid; font: var(--x-t12); color: var(--text-secondary); }
      .x-lane__head b { color: var(--text-primary); font-weight: var(--weight-medium); }
      .x-mini { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 8px; align-items: center; font: var(--x-t12); }
      .x-mini b { font-weight: var(--weight-medium); min-width: 0; overflow-wrap: anywhere; }
      .x-mini__t { grid-column: 1 / -1; overflow-wrap: anywhere; }
      .x-lane .x-empty { font: var(--x-t12); }

      /* People */
      .x-person { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 16px 0; border-top: 1px solid var(--stroke-secondary); }
      .x-person:first-child { border-top: 0; padding-top: 0; }
      .x-person__name { font: var(--x-t15m); }
      .x-person__meta { font: var(--x-t12); color: var(--text-secondary); }

      /* Krug: the ring is the hero. The screen is a size container, so the ring (100cqw square)
         can sit with its centre at 45% of the visible height between header (48) and tab bar. */
      .x-screen--krug { container-type: size; gap: 0; }
      .x-krug-top { flex: none; min-height: max(32px, calc(0.45 * (100cqh - 24px) - 50cqw)); display: flex; align-items: center; justify-content: center; }
      .x-krug { flex: none; width: 100%; aspect-ratio: 1; cursor: pointer; }
      .x-krug .x-rings svg text { font-family: var(--sans); font-variant-numeric: tabular-nums; }
      .x-krug-foot { flex: none; display: grid; gap: 16px; justify-items: center; padding-top: 16px; text-align: center; }
      .x-legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font: var(--x-t12); color: var(--text-secondary); }
      .x-legend span { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
      :root { --x-moon: light-dark(#ee9f33, #f2b14f); --x-eka: #7c3aed; --x-newmoon: #9a9a96; }
      .x-pdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--pc); flex: none; vertical-align: 1px; margin-right: 8px; }
      .x-lg-dots { display: inline-flex; gap: 2px; }
      .x-lg-dots .x-pdot { width: 6px; height: 6px; margin: 0; }
      .x-lg-full { width: 12px; height: 12px; border-radius: 50%; background: #ef9f27; opacity: 0.95; }
      .x-lg-new { position: relative; width: 10px; height: 10px; border-radius: 50%; background: var(--fill-primary-on); box-shadow: inset 0 0 0 0.8px color-mix(in srgb, var(--text-secondary) 60%, transparent); }
      .x-lg-new::after { content: ""; position: absolute; left: 50%; top: 50%; width: 3.6px; height: 3.6px; margin: -1.8px 0 0 -1.8px; border-radius: 50%; background: var(--text-secondary); opacity: 0.45; }
      .x-krug-legend { justify-content: center; }
      .x-lg-eka { width: 7px; height: 7px; margin: 0 1px; background: var(--x-eka); transform: rotate(45deg); }
      .x-lg-line { width: 14px; height: 2px; border-radius: 1px; background: var(--x-moon); }
      .x-eka { display: inline-flex; align-items: center; gap: 8px; height: 24px; padding: 0 8px; border-radius: var(--r-pill); border: 1px solid var(--x-eka); color: var(--text-primary); font: var(--x-t12m); }
      .x-eka::before { content: ""; width: 8px; height: 8px; background: var(--x-eka); transform: rotate(45deg); }
      .x-note { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: start; }
      .x-note + .x-note, .x-note + form, .x-notes + .links { border-top: 1px solid var(--stroke-secondary); padding-top: 8px; }
      .x-notes { display: grid; gap: 8px; }
      .x-notes > form { display: grid; gap: 8px; }

      /* Profile */
      .x-profile { display: grid; justify-items: center; gap: 8px; text-align: center; padding-top: 8px; }
      .x-profile .x-h1 { display: inline-flex; align-items: center; }
      .x-pick { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
      .x-pick label { position: relative; display: grid; justify-items: center; gap: 8px; padding: 8px 0; font: var(--x-t12); color: var(--text-secondary); cursor: pointer; min-width: 0; }
      .x-pick input { position: absolute; opacity: 0; width: 1px; height: 1px; }
      .x-pick .x-av { --s: 32px; }
      .x-pick input:checked + .x-av { box-shadow: inset 0 0 0 1.5px var(--es), 0 0 0 2px var(--fill-primary-on), 0 0 0 4px var(--fill-primary); }
      .x-pick input:focus-visible + .x-av { outline: 2px solid var(--fill-primary); outline-offset: 8px; }
      .x-field { display: grid; gap: 8px; font: var(--x-t15m); min-width: 0; }
      /* Personal shape mark */
      .x-shape { display: inline-block; width: 12px; height: 12px; flex: none; vertical-align: -1px; margin-right: 8px; overflow: visible; }
      .x-shapes { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
      .x-shapes label { position: relative; display: grid; place-items: center; height: 48px; border-radius: var(--r-s); color: var(--text-secondary); cursor: pointer; min-width: 0; }
      .x-shapes input { position: absolute; opacity: 0; width: 1px; height: 1px; }
      .x-shapes .x-shape { width: 24px; height: 24px; margin: 0; color: var(--text-primary); }
      .x-shapes label:has(input:checked) { background: var(--fill-tertiary); box-shadow: inset 0 0 0 1px var(--stroke-primary); }
      .x-card .x-shapes label:has(input:checked) { background: var(--fill-primary-on); }
      .x-shapes label:has(input:focus-visible) { outline: 2px solid var(--fill-primary); outline-offset: 2px; }
      .x-vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
      .x-krug-date { font: var(--x-t12); color: var(--text-secondary); text-align: center; }
      .x-krug-motto { font: var(--x-t15); color: var(--text-secondary); text-wrap: balance; }
      .x-krug-legend { justify-content: center; align-items: center; max-width: 100%; }
      .x-krug-legend > span { white-space: nowrap; flex: none; }
      .x-legend .x-shape { margin-right: 0; color: var(--text-primary); }

      /* Profile figures: three equal columns */
      .x-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
      .x-stats > div { display: grid; gap: 8px; padding: 16px; border-radius: var(--r-s); background: var(--fill-tertiary); min-width: 0; }
      .x-stats b { font: var(--x-t24); font-variant-numeric: tabular-nums; }
      .x-stats span { font: var(--x-t12); color: var(--text-secondary); }

      /* Bottom sheet: opens instantly */
      .x-scrim { position: absolute; inset: 0; z-index: 30; background: rgb(0 0 0 / 0.28); display: none; }
      .x-scrim.is-open { display: block; }
      .x-sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 31; max-height: 80%; overflow-y: auto; overflow-x: hidden; background: var(--fill-primary-on); border-radius: var(--r-l) var(--r-l) 0 0; box-shadow: var(--hark-shadow); padding: 8px 16px calc(24px + env(safe-area-inset-bottom, 0px)); gap: 16px; display: none; }
      .x-sheet.is-open { display: grid; }
      .x-sheet__grab { justify-self: center; width: 32px; height: 4px; border-radius: 2px; background: var(--stroke-primary); }
      .x-sheet h3 { font: var(--x-t19); }
      .x-help-list { display: grid; gap: 8px; padding: 0; margin: 0; list-style: none; font: var(--x-t15); }
    </style>
  </head>

    <script src="hark.js"></script>
    <script>
      (function () {
        var NS = 'http://www.w3.org/2000/svg';
        function mk(tag, attrs) {
          var e = document.createElementNS(NS, tag);
          if (attrs) {
            Object.keys(attrs).forEach(function (k) {
              e.setAttribute(k, attrs[k]);
            });
          }
          return e;
        }

        var RING_ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI'];
        var ELEM = ['Дерево', 'Огонь', 'Земля', 'Металл', 'Вода'];
        var MS = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
        var ML = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];

        function noon(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12, 0, 0); }
        function addDays(d, n) { var x = noon(d); x.setDate(x.getDate() + n); return x; }
        function pad(n) { return (n < 10 ? '0' : '') + n; }
        function keyOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
        function fmtShort(d) { return d.getDate() + ' ' + MS[d.getMonth()] + ' ' + d.getFullYear(); }
        function fmtDM(d) { return d.getDate() + ' ' + MS[d.getMonth()]; }
        function fmtLong(d) { return d.getDate() + ' ' + ML[d.getMonth()]; }
        function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

        /** День года 0 = 1 января (полдень) */
        function daysSinceJan1(ref) {
          var y = ref.getFullYear();
          var start = new Date(y, 0, 1, 12, 0, 0);
          var day = new Date(ref.getFullYear(), ref.getMonth(), ref.getDate(), 12, 0, 0);
          return Math.round((day - start) / 86400000);
        }

        function dayFromJan1(k, n) {
          return k * 60 + (n - 1) - 11;
        }

        function todayRingSlot(D) {
          var total = D + 12;
          var clamped = false;
          if (total < 1) {
            total = 1;
            clamped = true;
          } else if (total > 360) {
            total = 360;
            clamped = true;
          }
          var k = Math.floor((total - 1) / 60);
          var n = total - k * 60;
          return { k: k, n: n, clamped: clamped };
        }

        /** Element of a node: gzIdx = (k*60+n-1)%60, stem = gzIdx%10, element = stem/2 */
        function stemOf(k, n) { return ((k * 60 + (n - 1)) % 60) % 10; }
        function elemOf(k, n) { return Math.floor(stemOf(k, n) / 2); }

        var NOW = new Date();
        var TODAY = noon(NOW);
        var YEAR = TODAY.getFullYear();
        var TODAY_D = daysSinceJan1(TODAY);
        var TODAY_SLOT = todayRingSlot(TODAY_D);

        /* ---------- Daily ring logo: 60 tiny circles, today's position larger, centre empty ---------- */
        var LOGO_HEX = [['#eaf3de', '#639922'], ['#faece7', '#993c1d'], ['#faeeda', '#854f0b'], ['#f1efe8', '#5f5e5a'], ['#e6f1fb', '#185fa5']];
        /* mode: 'page' follows the theme; 'icon' and 'touch' use fixed colours for data: URLs */
        function logoSVG(n, mode) {
          var touch = mode === 'touch', page = mode === 'page';
          var LR = touch ? 36 : 44, r = 2.15 * LR / 44, rt = 3.1 * LR / 44;
          var sw = page ? 0.45 : touch ? 0.6 : 0.8, swt = page ? 0.9 : touch ? 1 : 1.3;
          var out = '', last = '';
          for (var i = 0; i < 60; i++) {
            var a = (i * 6 - 90) * Math.PI / 180, x = (50 + LR * Math.cos(a)).toFixed(2), y = (50 + LR * Math.sin(a)).toFixed(2);
            var isT = i === n - 1, stem = i % 10, hx = LOGO_HEX[Math.floor(stem / 2)];
            var c = page
              ? '<circle class="elem-' + stem + '" cx="' + x + '" cy="' + y + '" r="' + (isT ? rt : r) + '" style="fill:var(--ef);stroke:' + (isT ? 'var(--x-logo-t)' : 'var(--es)') + ';stroke-width:' + (isT ? swt : sw) + '"/>'
              : '<circle cx="' + x + '" cy="' + y + '" r="' + (isT ? rt : r) + '" fill="' + hx[0] + '" stroke="' + (isT ? '#444441' : hx[1]) + '" stroke-width="' + (isT ? swt : sw) + '"/>';
            if (isT) last = c; else out += c;
          }
          return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"' + (page ? ' aria-hidden="true" focusable="false"' : '') + '>' +
            (touch ? '<rect width="100" height="100" fill="#fbfaf8"/>' : '') + out + last + '</svg>';
        }
        function svgURL(s) { return 'data:image/svg+xml,' + encodeURIComponent(s); }
        function logo(size) { return '<span class="x-logo" data-logo style="--ls:' + size + 'px" aria-hidden="true">' + logoSVG(LOGO_N, 'page') + '</span>'; }
        function setLink(id, rel, href, type) {
          var l = document.getElementById(id);
          if (!l) { l = document.createElement('link'); l.id = id; l.rel = rel; document.head.appendChild(l); }
          if (type) l.type = type;
          l.href = href;
        }
        var LOGO_N = TODAY_SLOT.n;
        function applyLogo() {
          setLink('x-fav', 'icon', svgURL(logoSVG(LOGO_N, 'icon')), 'image/svg+xml');
          var touch = svgURL(logoSVG(LOGO_N, 'touch'));
          setLink('x-touch', 'apple-touch-icon', touch);
          setLink('x-manifest', 'manifest', 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify({
            name: 'CENTRAL', short_name: 'CENTRAL', display: 'standalone', background_color: '#fbfaf8', theme_color: '#fbfaf8',
            icons: [{ src: touch, sizes: 'any', type: 'image/svg+xml', purpose: 'any' }]
          })));
          [].forEach.call(document.querySelectorAll('[data-logo]'), function (el) { el.innerHTML = logoSVG(LOGO_N, 'page'); });
        }
        /* Re-check once the date changes: instant swap, no motion */
        function checkLogoDay() {
          var n = todayRingSlot(daysSinceJan1(new Date())).n;
          if (n !== LOGO_N) { LOGO_N = n; applyLogo(); }
        }
        function scheduleMidnight() {
          var now = new Date(), next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 5);
          setTimeout(function () { checkLogoDay(); scheduleMidnight(); }, next - now);
        }
        document.addEventListener('visibilitychange', function () { if (!document.hidden) checkLogoDay(); });
        applyLogo();
        scheduleMidnight();

        function dateOfSlot(k, n) { return new Date(YEAR, 0, 1 + dayFromJan1(k, n), 12, 0, 0); }

        /** Ring slot of any date: its own year's grid, or next year's ring I for late December */
        function slotOf(date) {
          var d = noon(date);
          if (keyOf(d) === keyOf(TODAY)) return { k: TODAY_SLOT.k, n: TODAY_SLOT.n, out: false };
          var total = daysSinceJan1(d) + 12;
          if (total > 360) {
            var next = new Date(d.getFullYear() + 1, 0, 1, 12, 0, 0);
            var t2 = Math.round((d - next) / 86400000) + 12;
            if (t2 >= 1) total = t2;
            else return { out: true };
          }
          var k = Math.floor((total - 1) / 60);
          return { k: k, n: total - k * 60, out: false };
        }
        function slotLabel(s) { return s.out ? 'Между кольцами' : 'Кольцо ' + RING_ROMAN[s.k] + ' · позиция ' + s.n; }
        function elemTag(s) {
          if (s.out) return '';
          return '<span class="x-elem elem-' + stemOf(s.k, s.n) + '">' + ELEM[elemOf(s.k, s.n)] + '</span>';
        }

        /* ---------- Six rings (geometry and styling from the original buildSixRings) ---------- */
        var W = 720, H = 720, cx = W / 2, cy = H / 2, R = 155, OFFSET = Math.PI / 2, Rref = 265;
        var rNode = (R * 10) / Rref;
        var rTodayNode = (R * 13) / Rref;
        var fsNode = (11 * R) / Rref;

        function nodeXY(k, i) {
          var th = k * (Math.PI / 3) + OFFSET;
          var ox = cx + R * Math.cos(th);
          var oy = cy + R * Math.sin(th);
          var t = (2 * Math.PI * i) / 59;
          var a = t + Math.PI + th;
          return { x: Math.round(ox + R * Math.cos(a)), y: Math.round(oy + R * Math.sin(a)), ox: ox, oy: oy };
        }

        function buildSixRings(prefix) {
          var svg0 = document.getElementById(prefix + '-ring-0');
          if (!svg0) return;
          var D = TODAY_D;
          var todayK = TODAY_SLOT.k;
          var todayN = TODAY_SLOT.n;
          var labelStyle = 'font-size:12px;font-weight:500;fill:var(--x-ts);opacity:0.9';

          svg0.appendChild(mk('line', { x1: cx, y1: 44, x2: cx, y2: H - 44, stroke: 'var(--x-bt)', 'stroke-width': 0.7, 'stroke-dasharray': '3 7' }));

          var labelSummer = mk('text', { x: cx, y: 26, 'text-anchor': 'middle', style: labelStyle });
          labelSummer.textContent = '☀ лето · летнее солнцестояние';
          svg0.appendChild(labelSummer);
          var labelWinter = mk('text', { x: cx, y: H - 18, 'text-anchor': 'middle', style: labelStyle });
          labelWinter.textContent = '🌑 зима · зимнее солнцестояние';
          svg0.appendChild(labelWinter);

          function appendRingNodes(svg, k) {
            for (var i = 0; i < 60; i++) {
              var n = i + 1;
              var p = nodeXY(k, i);
              var x = p.x, y = p.y;
              var day = dayFromJan1(k, n);
              var isToday = k === todayK && n === todayN;
              var isPassed = day <= D;
              var g = mk('g', { class: 'elem-' + stemOf(k, n) });

              var title = mk('title');
              title.textContent = 'Кольцо ' + RING_ROMAN[k] + ', поз. ' + n + ' · ' + ELEM[elemOf(k, n)] + ' · ' + fmtShort(dateOfSlot(k, n));
              g.appendChild(title);

              var rad = isToday ? rTodayNode : rNode;
              var fillStyle, strokeStyle, sw = '0.5';
              if (isToday) { fillStyle = 'var(--ef)'; strokeStyle = 'var(--es)'; sw = '2'; }
              else if (!isPassed) { fillStyle = 'var(--x-ts)'; strokeStyle = 'var(--x-bt)'; }
              else { fillStyle = 'var(--ef)'; strokeStyle = 'var(--es)'; }

              var c = mk('circle', {
                cx: x, cy: y, r: rad,
                style: 'fill:' + fillStyle + ';stroke:' + strokeStyle + ';stroke-width:' + sw + ';opacity:' + (!isPassed && !isToday ? '0.32' : '1'),
              });
              c.setAttribute('pointer-events', 'none');

        /* ---------- Круг ---------- */
        var selected = null;
        /* One 60-day ring: node n is the day TODAY + (n − today's position).
           Geometry and wave math from ganzhi_lunar_wave_v2.html */
        /* Notes grow inward with a FIXED step: about 24 notes on one day (everyone together) reach the centre ring */
        /* Proportions from the viewBox width W: node ring R = 0.43·W; node d = (2πR/60)/1.6, so the gap is 0.6·d all round;
           number 0.42·d; mark 0.24·d; first mark at R − d/2 − 0.6·d; step = (first − centre ring)/24; centre point 0.012·W, ring 0.04·W */
        var KW = 680, KC = KW / 2, KR = 0.43 * KW, KD = (2 * Math.PI * KR / 60) / 1.6, KNR = KD / 2, KFS = 0.42 * KD;
        var KDOT = 0.24 * KD / 2, KCR = 0.04 * KW, KPT = 0.012 * KW, KREACH = 24;
        var KR0 = KR - KD / 2 - 0.6 * KD, KSTEP = (KR0 - KCR) / KREACH;
        var RW = 252, AMP = 42;
        /* lunar wave, moon markers and Ekadashi: off for now, kept for a later option */
        var SHOW_MOON = false;
        var SYNODIC = 29.530589, NM0 = Date.UTC(2000, 0, 6, 18, 14);
        var TODAY_N = TODAY_SLOT.n;
        var WIN = [];
        for (var wi = 0; wi < 60; wi++) WIN.push(addDays(TODAY, wi + 1 - TODAY_N));
        /* phase of node i: 0 new, 0.5 full */
        var PH = WIN.map(function (d) { var x = ((d.getTime() - NM0) / 86400000) / SYNODIC; return ((x % 1) + 1) % 1; });
        function ph(i) { return PH[i]; }
        function dp(p) { return -AMP * Math.cos(p * 2 * Math.PI); }
        function ang(i) { return (i * 6 - 90) * Math.PI / 180; }
        function at(i, r) { var a = ang(i); return { x: KC + r * Math.cos(a), y: KC + r * Math.sin(a) }; }
        function waveAt(i) { return at(i, RW + dp(ph(i))); }
        function f1(v) { return Math.round(v * 100) / 100; }
        function crPath(pts) {
          var n = pts.length, pt = function (i) { return pts[((i % n) + n) % n]; };
          var d = 'M ' + pt(0).x.toFixed(2) + ' ' + pt(0).y.toFixed(2);
          for (var i = 0; i < n; i++) {
            var p0 = pt(i - 1), p1 = pt(i), p2 = pt(i + 1), p3 = pt(i + 2);
            var bx1 = p1.x + (p2.x - p0.x) / 6, by1 = p1.y + (p2.y - p0.y) / 6;
            var bx2 = p2.x - (p3.x - p1.x) / 6, by2 = p2.y - (p3.y - p1.y) / 6;
            d += ' C ' + bx1.toFixed(2) + ' ' + by1.toFixed(2) + ' ' + bx2.toFixed(2) + ' ' + by2.toFixed(2) + ' ' + p2.x.toFixed(2) + ' ' + p2.y.toFixed(2);
          }

            if (i < 59 && dist(ph(i + 1)) <= v) continue;
            out.push(i);
          }
          return out;
        }

        var NEW_I = nearest(function (p) { return Math.min(p, 1 - p); });
        function svgText(svg, x, y, txt, style) {

        function renderKrug() {

          /* lunar wave: closed Catmull-Rom through 60 points at RW + dp(ph(i)) */

          var ekaDays = [], fullDays = [];

          /* note dots: one neat radial line per day, starting just inside the node.

          var trackOf = { me: 0 }, nTracks = 1;

            var cols = dayDots[i], shown = cols.slice(0, KREACH);

            svg.appendChild(mk('circle', { cx: f1(w.x), cy: f1(w.y), r: 1.8, style: 'fill:var(--text-secondary);fill-opacity:0.45' }));

            svg.appendChild(mk('polygon', {

          svg.appendChild(mk('circle', { cx: KC, cy: KC, r: f1(KPT), style: 'fill:var(--text-primary)' }));

            'Круг 60 дней с ' + fmtShort(WIN[0]) + ' по ' + fmtShort(WIN[59]) + '. Сегодня ' + TODAY_N + ' из 60' +

          sheet.innerHTML = '<span class="x-sheet__grab" aria-hidden="true"></span>' +
            '<div class="x-row x-row--between"><p class="x-label">' + slotLabel(s) + '</p><button class="btn" type="button" id="sh-close">Закрыть</button></div>' +
            '<div><h3>' + fmtShort(date) + '</h3><div class="x-day" style="margin-top:8px">' + elemTag(s) + moonTag(date) + (isT ? '<span class="chip chip--solid">Сегодня</span>' : '') + (future ? '<span class="chip">Ещё впереди</span>' : '') + '</div></div>' +
            '<div class="x-card"><p class="x-label">' + (mn.length > 1 ? 'Мои записи · ' + mn.length : 'Моя запись') + '</p>' +
            (mn.length ? mn.map(function (t, i) { return '<p>' + shapeIcon(shapeOf(user), myColor(key, i)) + esc(t) + '</p>'; }).join('') : '<p class="x-empty">' + (future ? 'День ещё не наступил.' : 'Записи нет.') + '</p>') +
            (isT ? '<div class="links"><button class="btn" type="button" id="sh-write">' + (mn.length ? '+ ещё мысль' : 'Написать') + '</button></div>' : '') + '</div>' +
            (future ? '' : '<div><p class="x-label" style="margin-bottom:8px">Друзья · ' + list.length + '</p>' + (list.length ? entryRows(list) : '<p class="x-empty">Никто из друзей не писал.</p>') + '</div>') +
            '<div class="x-card"><div class="x-row x-row--between"><p class="x-label">60 дней назад</p><span class="pill">' + fmtShort(ago) + '</span></div>' +
            '<div class="x-day">' + moonTag(ago) + '</div>' +
            (agoList.length ? entryRows(agoList) : '<p class="x-empty">В этот день записей нет.</p>') + '</div>';
          openSheet('День');
          var w = document.getElementById('sh-write');
          if (w) w.addEventListener('click', function () { adding = myNotes(keyOf(TODAY)).length > 0; editIdx = -1; show('today'); var ta = document.getElementById('t-text'); if (ta) ta.focus(); });
        }
        /* shows the sheet instantly: no motion */
        function openSheet(label) {
          if (!sheet.classList.contains('is-open')) lastFocus = document.activeElement;
          sheet.setAttribute('aria-label', label);
          sheet.scrollTop = 0;
          sheet.classList.add('is-open'); scrim.classList.add('is-open');
          document.getElementById('sh-close').addEventListener('click', closeSheet);
          document.getElementById('sh-close').focus();
        }
        /* "?" on Круг: how to read the ring */
        function openHelp() {
          sheet.innerHTML = '<span class="x-sheet__grab" aria-hidden="true"></span>' +
            '<div class="x-row x-row--between"><p class="x-label">Как читать</p><button class="btn" type="button" id="sh-close">Закрыть</button></div>' +
            '<h3>Круг 60 дней</h3>' +
            '<ul class="x-help-list">' +
            '<li>Шестьдесят дней вокруг сегодняшнего.</li>' +
            '<li>Заметки идут от узла дня к центру: цвет — заметка, форма — автор.</li>' +
            '<li>От узла к центру: сначала мои, затем друзья по порядку.</li>' +
            '<li>Коснитесь узла, чтобы открыть день.</li>' +
            '</ul>' +
            '<div class="x-card"><p class="x-label">Стихии</p><div class="x-legend" aria-label="Стихии">' +
            ELEM.map(function (n, i) { return '<span><i class="x-edot elem-' + i * 2 + '"></i>' + n + '</span>'; }).join('') +
            '</div></div>';
          openSheet('Как читать Круг');
        }
        document.getElementById('k-help').addEventListener('click', openHelp);
        function closeSheet() {
          if (!sheet.classList.contains('is-open')) return;
          sheet.classList.remove('is-open'); scrim.classList.remove('is-open');
          if (selected) { selected = null; if (current === 'krug') renderKrug(); }
          if (lastFocus && lastFocus.focus) lastFocus.focus();
        }
        scrim.addEventListener('click', closeSheet);
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

        [].forEach.call(document.querySelectorAll('.x-tab'), function (b) {
          b.addEventListener('click', function () { show(b.getAttribute('data-tab')); });
        });

        /* ---------- Splash ---------- */
        var splash = document.getElementById('splash'), sRings = document.getElementById('s-rings'), phone = document.getElementById('phone');
        var splashOpen = true;
        var sLine = slotLabel({ k: TODAY_SLOT.k, n: TODAY_SLOT.n }).replace('Кольцо', 'Кольцо') + ' · ' + fmtShort(TODAY);
        document.getElementById('s-line').textContent = 'Открыть сегодня · ' + sLine;
        sRings.setAttribute('aria-label', 'Войти в CENTRAL. Сегодня: ' + sLine);

        function enter() {
          if (!splashOpen) return;
          splash.hidden = true;
          splashOpen = false;
          phone.hidden = false;
          show(user ? 'today' : 'reg');
        }
        function openSplash() {
          closeSheet();
          splash.hidden = false; splashOpen = true;
          sRings.focus();
        }
        sRings.addEventListener('click', enter);
        sRings.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); enter(); } });

        buildSixRings('s');
      })();
    </script>
  </body>
</html>
