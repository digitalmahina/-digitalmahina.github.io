<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CENTRAL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap"
    />
    <link rel="stylesheet" href="hark.css" />
    <link rel="stylesheet" href="hark-hero.css" />
    <style>
      /* Element palettes from the original page, following the theme */
      .elem-0, .elem-1 { --ef: light-dark(#eaf3de, #173404); --es: light-dark(#639922, #97c459); --et: light-dark(#27500a, #c0dd97); }
      .elem-2, .elem-3 { --ef: light-dark(#faece7, #4a1b0c); --es: light-dark(#993c1d, #f0997b); --et: light-dark(#711313, #f5c4b3); }
      .elem-4, .elem-5 { --ef: light-dark(#faeeda, #412402); --es: light-dark(#854f0b, #ef9f27); --et: light-dark(#633806, #fac775); }
      .elem-6, .elem-7 { --ef: light-dark(#f1efe8, #2c2c2a); --es: light-dark(#5f5e5a, #b4b2a9); --et: light-dark(#444441, #d3d1c7); }
      .elem-8, .elem-9 { --ef: light-dark(#e6f1fb, #042c53); --es: light-dark(#185fa5, #85b7eb); --et: light-dark(#0c447c, #b5d4f4); }
      :root {
        --x-ts: #888780;
        --x-bt: light-dark(rgba(0, 0, 0, 0.22), rgba(255, 255, 255, 0.22));
      }

      /* Six-ring stack */
      .x-rings { position: relative; aspect-ratio: 1; user-select: none; -webkit-user-select: none; contain: layout style paint; }
      .x-rings svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; pointer-events: none; shape-rendering: geometricPrecision; }
      .x-rings svg text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

      /* Splash */
      .x-splash {
        position: fixed; inset: 0; z-index: 9000;
        display: grid; grid-template-rows: auto minmax(0, 1fr) auto; justify-items: center; align-items: center;
        padding: max(14px, env(safe-area-inset-top)) 8px max(18px, env(safe-area-inset-bottom));
        background: var(--fill-primary-on);
        transition: background-color 420ms var(--ease-out) 380ms, opacity 300ms ease 520ms;
      }
      .x-splash[hidden] { display: none; }
      .x-wordmark { font: var(--type-tag); letter-spacing: 0.32em; padding-left: 0.32em; color: var(--text-primary); }
      .x-splash__rings {
        width: min(calc(100vw - 16px), calc(100dvh - 104px)); cursor: pointer; border-radius: 50%;
        transition: transform 760ms cubic-bezier(0.55, 0, 0.85, 0.25), opacity 520ms ease 260ms, filter 760ms ease;
      }
      .x-splash__rings:focus-visible { outline-offset: -6px; }
      .x-splash__line { font: var(--type-caption); color: var(--text-secondary); text-align: center; }
      .x-splash.is-falling { opacity: 0; pointer-events: none; }
      .x-splash.is-falling .x-splash__rings { transform: scale(9); opacity: 0; filter: blur(2px); }
      .x-splash.is-falling .x-wordmark, .x-splash.is-falling .x-splash__line { opacity: 0; transition: opacity 200ms ease; }
      @media (prefers-reduced-motion: reduce) {
        .x-splash, .x-splash__rings { transition: opacity 200ms ease; }
        .x-splash.is-falling .x-splash__rings { transform: none; filter: none; }
      }

      .x-ripple { position: fixed; inset: 0; z-index: 9990; pointer-events: none; overflow: hidden; }
      .x-ripple canvas { display: block; width: 100%; height: 100%; }

      /* Phone frame */
      .x-phone {
        position: relative; width: min(400px, 100%); height: min(860px, calc(100dvh - 40px)); margin: 8px auto 0;
        display: flex; flex-direction: column; overflow: hidden;
        background: var(--fill-primary-on); border: 1px solid var(--stroke-primary); border-radius: var(--r-xl); box-shadow: var(--hark-shadow);
      }
      .x-phone[hidden] { display: none; }
      .x-phone.is-entering { animation: x-enter 520ms var(--ease-out); }
      @keyframes x-enter { from { opacity: 0; transform: scale(1.06); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { .x-phone.is-entering { animation: none; } }
      @media (max-width: 480px) {
        .x-phone { width: calc(100% + 2 * var(--gutter)); margin: -12px calc(-1 * var(--gutter)) -40px; height: 100dvh; border: 0; border-radius: 0; box-shadow: none; }
      }
      .x-screen { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 18px 28px; display: none; flex-direction: column; gap: 18px; overscroll-behavior: contain; }
      .x-screen.is-active { display: flex; }
      .x-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .x-top .x-wordmark { font-size: var(--size-caption); }
      .x-h1 { font: var(--type-title); }
      .x-sub { font: var(--type-small); color: var(--text-secondary); }
      .x-label { font: var(--type-tag); color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.06em; }

      .x-tabs { display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--stroke-secondary); background: var(--mat-regular); -webkit-backdrop-filter: var(--hark-blur); backdrop-filter: var(--hark-blur); padding-bottom: env(safe-area-inset-bottom); }
      .x-tabs[hidden] { display: none; }
      .x-tab { appearance: none; border: 0; background: none; color: var(--text-secondary); font: var(--type-tag); min-height: 56px; display: grid; place-items: center; gap: 2px; padding: 8px 2px; cursor: pointer; }
      .x-tab::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: transparent; }
      .x-tab[aria-current="page"] { color: var(--text-primary); }
      .x-tab[aria-current="page"]::before { background: var(--fill-primary); }

      /* Cards and rows */
      .x-card { background: var(--fill-tertiary); border-radius: var(--r-m); padding: 16px; display: grid; gap: 10px; }
      .x-card--link { cursor: pointer; }
      .x-day { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font: var(--type-caption); color: var(--text-secondary); }
      .x-elem { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: var(--r-pill); background: var(--ef); color: var(--et); font: var(--type-tag); }
      .x-elem::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--es); }
      .x-edot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--es); flex: none; }
      .x-av { --s: 32px; width: var(--s); height: var(--s); flex: none; border-radius: 50%; display: inline-grid; place-items: center; background: var(--ef); color: var(--et); box-shadow: inset 0 0 0 1.5px var(--es); font: var(--weight-bold) max(12px, calc(var(--s) * 0.42)) / 1 var(--sans); }
      .x-entries { display: grid; }
      .x-entry { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; padding: 10px 0; border-top: 1px solid var(--stroke-secondary); }
      .x-entry:first-child { border-top: 0; padding-top: 0; }
      .x-entry__name { font: var(--type-label); }
      .x-entry__name small { color: var(--text-secondary); font-weight: var(--weight-regular); }
      .x-entry__text { font: var(--type-small); }
      .x-empty { font: var(--type-small); color: var(--text-secondary); }

      .x-textarea, .x-input { width: 100%; font: var(--type-body); color: var(--text-primary); background: var(--fill-primary-on); border: 1px solid var(--stroke-primary); border-radius: var(--r-s); padding: 12px; }
      .x-textarea { min-height: 96px; resize: vertical; }
      .x-input { min-height: var(--tap); }
      .x-textarea:focus, .x-input:focus { outline: 2px solid var(--fill-primary); outline-offset: 1px; }
      .x-primary { appearance: none; border: 0; cursor: pointer; min-height: var(--tap); padding: 10px 18px; border-radius: var(--r-s); background: var(--fill-primary); color: var(--text-primary-on); font: var(--type-label); }
      .x-primary:disabled { opacity: 0.4; cursor: default; }
      .x-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
      .x-row--between { justify-content: space-between; }
      button.btn { cursor: pointer; }

      /* Parallel feed */
      .x-feedday { display: grid; gap: 10px; padding-top: 14px; border-top: 1px solid var(--stroke-primary); }
      .x-feedday:first-child { border-top: 0; padding-top: 0; }
      .x-par { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .x-lane { background: var(--fill-tertiary); border-radius: var(--r-s); padding: 10px; display: grid; gap: 8px; align-content: start; min-width: 0; }
      .x-lane__head { display: grid; gap: 2px; font: var(--type-caption); color: var(--text-secondary); }
      .x-lane__head b { color: var(--text-primary); font-weight: var(--weight-medium); }
      .x-mini { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px; align-items: start; font: var(--type-caption); }
      .x-mini b { font-weight: var(--weight-medium); display: block; }
      .x-mini span:last-child { overflow-wrap: anywhere; }

      /* People */
      .x-person { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--stroke-secondary); }
      .x-person:first-child { border-top: 0; }
      .x-person__name { font: var(--type-label); }
      .x-person__meta { font: var(--type-caption); color: var(--text-secondary); }

      /* Krug */
      .x-krug { overflow: auto; margin-inline: -18px; padding-inline: 4px; border-block: 1px solid var(--stroke-secondary); overscroll-behavior: contain; }
      .x-krug__inner { width: calc(100% * var(--z, 1)); cursor: pointer; }
      .x-legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font: var(--type-caption); color: var(--text-secondary); }
      .x-legend span { display: inline-flex; align-items: center; gap: 6px; }
      :root { --x-moon: light-dark(#ee9f33, #f2b14f); --x-eka: #7c3aed; --x-newmoon: #9a9a96; }
      .x-pdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--pc); flex: none; vertical-align: 1px; margin-right: 5px; }
      .x-lg-dots { display: inline-flex; gap: 2px; }
      .x-lg-dots .x-pdot { width: 6px; height: 6px; margin: 0; }
      .x-lg-full { width: 9px; height: 9px; border-radius: 50%; background: var(--x-moon); }
      .x-lg-new { width: 9px; height: 9px; border-radius: 50%; background: var(--fill-primary-on); box-shadow: inset 0 0 0 1.5px var(--x-newmoon); }
      .x-lg-eka { width: 7px; height: 7px; margin: 0 1px; background: var(--x-eka); transform: rotate(45deg); }
      .x-lg-line { width: 14px; height: 2px; border-radius: 1px; background: var(--x-moon); }
      .x-eka { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 9px; border-radius: var(--r-pill); border: 1px solid var(--x-eka); color: var(--text-primary); font: var(--type-tag); }
      .x-eka::before { content: ""; width: 7px; height: 7px; background: var(--x-eka); transform: rotate(45deg); }
      .x-note { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: start; }
      .x-note + .x-note, .x-note + form, .x-notes + .links { border-top: 1px solid var(--stroke-secondary); padding-top: 10px; }
      .x-notes { display: grid; gap: 10px; }
      .x-notes > form { display: grid; gap: 10px; }

      /* Profile */
      .x-profile { display: grid; justify-items: center; gap: 8px; text-align: center; padding-top: 8px; }
      .x-pick { display: flex; flex-wrap: wrap; gap: 10px; }
      .x-pick label { display: grid; justify-items: center; gap: 4px; font: var(--type-caption); color: var(--text-secondary); cursor: pointer; }
      .x-pick input { position: absolute; opacity: 0; width: 1px; height: 1px; }
      .x-pick .x-av { --s: 44px; }
      .x-pick input:checked + .x-av { box-shadow: inset 0 0 0 1.5px var(--es), 0 0 0 2px var(--fill-primary-on), 0 0 0 4px var(--fill-primary); }
      .x-pick input:focus-visible + .x-av { outline: 2px solid var(--fill-primary); outline-offset: 6px; }
      .x-field { display: grid; gap: 6px; font: var(--type-label); }

      /* Bottom sheet */
      .x-scrim { position: absolute; inset: 0; z-index: 30; background: rgb(0 0 0 / 0.28); opacity: 0; pointer-events: none; transition: opacity var(--dur-quick, 200ms) ease; }
      .x-scrim.is-open { opacity: 1; pointer-events: auto; }
      .x-sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 31; max-height: 78%; overflow-y: auto; background: var(--fill-primary-on); border-radius: var(--r-l) var(--r-l) 0 0; box-shadow: var(--hark-shadow); padding: 10px 18px calc(22px + env(safe-area-inset-bottom)); display: grid; gap: 14px; transform: translateY(105%); transition: transform 320ms var(--ease-out); visibility: hidden; }
      .x-sheet.is-open { transform: none; visibility: visible; }
      .x-sheet__grab { justify-self: center; width: 40px; height: 4px; border-radius: 2px; background: var(--stroke-primary); }
      .x-sheet h3 { font: var(--type-heading); }
      @media (prefers-reduced-motion: reduce) { .x-sheet { transition: none; } }
    </style>
  </head>
  <body>
    <div class="x-splash" id="splash">
      <p class="x-wordmark">CENTRAL</p>
      <div class="x-rings x-splash__rings" id="s-rings" role="button" tabindex="0" aria-label="Войти в CENTRAL">
        <svg id="s-ring-0" viewBox="0 0 720 720" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
        <svg id="s-ring-1" viewBox="0 0 720 720" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
        <svg id="s-ring-2" viewBox="0 0 720 720" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
        <svg id="s-ring-3" viewBox="0 0 720 720" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
        <svg id="s-ring-4" viewBox="0 0 720 720" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
        <svg id="s-ring-5" viewBox="0 0 720 720" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
      </div>
      <p class="x-splash__line" id="s-line"></p>
    </div>

    <div class="page" id="top">
      <main class="main">
        <div class="x-phone" id="phone" hidden>
          <section class="x-screen" id="scr-reg" aria-label="Регистрация"></section>
          <section class="x-screen" id="scr-today" aria-label="Сегодня"></section>
          <section class="x-screen" id="scr-feed" aria-label="Лента"></section>
          <section class="x-screen" id="scr-krug" aria-label="Круг">
            <div class="x-top"><p class="x-wordmark">CENTRAL</p><span class="chip" id="k-today-chip"></span></div>
            <div>
              <h1 class="x-h1">Круг 60 дней</h1>
              <p class="x-sub">Шестьдесят дней вокруг сегодняшнего и луна над ними. Точки от узла к центру — записи дня. Коснитесь узла, чтобы открыть день.</p>
            </div>
            <div class="x-legend" aria-label="Стихии">
              <span><i class="x-edot elem-0"></i>Дерево</span><span><i class="x-edot elem-2"></i>Огонь</span><span><i class="x-edot elem-4"></i>Земля</span><span><i class="x-edot elem-6"></i>Металл</span><span><i class="x-edot elem-8"></i>Вода</span>
            </div>
            <div class="x-krug" id="k-scroll">
              <div class="x-krug__inner" id="k-inner">
                <div class="x-rings" id="k-rings" role="img" aria-label="Круг 60 дней с записями и фазами луны">
                  <svg id="k-ring" viewBox="0 0 640 640" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
                </div>
              </div>
            </div>
            <div class="x-legend" id="k-legend" aria-label="Обозначения"></div>
            <div class="x-row x-row--between">
              <div class="links">
                <button class="btn" type="button" id="k-zout" aria-label="Уменьшить">−</button>
                <button class="btn" type="button" id="k-zin" aria-label="Увеличить">+</button>
              </div>
              <button class="btn" type="button" id="k-open-today">Открыть сегодня</button>
            </div>
          </section>
          <section class="x-screen" id="scr-people" aria-label="Люди"></section>
          <section class="x-screen" id="scr-profile" aria-label="Профиль"></section>

          <nav class="x-tabs" id="tabs" aria-label="Разделы" hidden>
            <button class="x-tab" type="button" data-tab="today">Сегодня</button>
            <button class="x-tab" type="button" data-tab="feed">Лента</button>
            <button class="x-tab" type="button" data-tab="krug">Круг</button>
            <button class="x-tab" type="button" data-tab="people">Люди</button>
            <button class="x-tab" type="button" data-tab="profile">Профиль</button>
          </nav>

          <div class="x-scrim" id="scrim"></div>
          <div class="x-sheet" id="sheet" role="dialog" aria-modal="true" aria-label="День"></div>
        </div>
      </main>
    </div>

    <div class="x-ripple" id="ripple-plane" aria-hidden="true"><canvas id="ripple-canvas"></canvas></div>

    <script src="hark.js"></script>
    <script>
      (function () {
        var NS = 'http://www.w3.org/2000/svg';
        var REDUCED =
          typeof window.matchMedia === 'function' &&
          window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        function mk(tag, attrs) {
          var e = document.createElementNS(NS, tag);
          if (attrs) {
            Object.keys(attrs).forEach(function (k) {
              e.setAttribute(k, attrs[k]);
            });
          }
          return e;
        }

        var RING_ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI'];
        var ELEM = ['Дерево', 'Огонь', 'Земля', 'Металл', 'Вода'];
        var MS = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
        var ML = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];

        function noon(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12, 0, 0); }
        function addDays(d, n) { var x = noon(d); x.setDate(x.getDate() + n); return x; }
        function pad(n) { return (n < 10 ? '0' : '') + n; }
        function keyOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
        function fmtShort(d) { return d.getDate() + ' ' + MS[d.getMonth()] + ' ' + d.getFullYear(); }
        function fmtDM(d) { return d.getDate() + ' ' + MS[d.getMonth()]; }
        function fmtLong(d) { return d.getDate() + ' ' + ML[d.getMonth()]; }
        function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

        /** День года 0 = 1 января (полдень) */
        function daysSinceJan1(ref) {
          var y = ref.getFullYear();
          var start = new Date(y, 0, 1, 12, 0, 0);
          var day = new Date(ref.getFullYear(), ref.getMonth(), ref.getDate(), 12, 0, 0);
          return Math.round((day - start) / 86400000);
        }

        function dayFromJan1(k, n) {
          return k * 60 + (n - 1) - 11;
        }

        function todayRingSlot(D) {
          var total = D + 12;
          var clamped = false;
          if (total < 1) {
            total = 1;
            clamped = true;
          } else if (total > 360) {
            total = 360;
            clamped = true;
          }
          var k = Math.floor((total - 1) / 60);
          var n = total - k * 60;
          return { k: k, n: n, clamped: clamped };
        }

        /** Element of a node: gzIdx = (k*60+n-1)%60, stem = gzIdx%10, element = stem/2 */
        function stemOf(k, n) { return ((k * 60 + (n - 1)) % 60) % 10; }
        function elemOf(k, n) { return Math.floor(stemOf(k, n) / 2); }

        var NOW = new Date();
        var TODAY = noon(NOW);
        var YEAR = TODAY.getFullYear();
        var TODAY_D = daysSinceJan1(TODAY);
        var TODAY_SLOT = todayRingSlot(TODAY_D);

        function dateOfSlot(k, n) { return new Date(YEAR, 0, 1 + dayFromJan1(k, n), 12, 0, 0); }

        /** Ring slot of any date: its own year's grid, or next year's ring I for late December */
        function slotOf(date) {
          var d = noon(date);
          if (keyOf(d) === keyOf(TODAY)) return { k: TODAY_SLOT.k, n: TODAY_SLOT.n, out: false };
          var total = daysSinceJan1(d) + 12;
          if (total > 360) {
            var next = new Date(d.getFullYear() + 1, 0, 1, 12, 0, 0);
            var t2 = Math.round((d - next) / 86400000) + 12;
            if (t2 >= 1) total = t2;
            else return { out: true };
          }
          var k = Math.floor((total - 1) / 60);
          return { k: k, n: total - k * 60, out: false };
        }
        function slotLabel(s) { return s.out ? 'Между кольцами' : 'Кольцо ' + RING_ROMAN[s.k] + ' · позиция ' + s.n; }
        function elemTag(s) {
          if (s.out) return '';
          return '<span class="x-elem elem-' + stemOf(s.k, s.n) + '">' + ELEM[elemOf(s.k, s.n)] + '</span>';
        }

        /* ---------- Six rings (geometry and styling from the original buildSixRings) ---------- */
        var W = 720, H = 720, cx = W / 2, cy = H / 2, R = 155, OFFSET = Math.PI / 2, Rref = 265;
        var rNode = (R * 10) / Rref;
        var rTodayNode = (R * 13) / Rref;
        var fsNode = (11 * R) / Rref;

        function nodeXY(k, i) {
          var th = k * (Math.PI / 3) + OFFSET;
          var ox = cx + R * Math.cos(th);
          var oy = cy + R * Math.sin(th);

        /* ---------- Круг ---------- */
        var zoom = 1, selected = null;
        /* One 60-day ring: node n is the day TODAY + (n − today's position) */
        var KC = 320, KRN = 288, KNR = 13.5, KTR = 18.5, KMIN = 150, KMAX = 283, KDOT0 = KRN - KNR - 9, KSTEP = 8.6, KDISC = 98;
        var TODAY_N = TODAY_SLOT.n;
        var WIN = [];
        for (var wi = 0; wi < 60; wi++) WIN.push(addDays(TODAY, wi + 1 - TODAY_N));
        var curveD = null;
        function moonR(e) { return KMIN + (KMAX - KMIN) * (1 - Math.cos(e * RAD)) / 2; }
        function polar(t, r) { var a = -Math.PI / 2 + (2 * Math.PI * t) / 60; return { x: KC + r * Math.cos(a), y: KC + r * Math.sin(a) }; }
        function f1(v) { return Math.round(v * 10) / 10; }
        function moonCurve() {
          if (curveD) return curveD;
          var t0 = atHour(WIN[0], 0).getTime(), pts = [];
          for (var j = 0; j <= 360; j++) {

        function svgText(svg, x, y, txt, style) {

        function renderKrug() {

          /* lunar curve */
          svg.appendChild(mk('path', { d: moonCurve(), style: 'fill:none;stroke:var(--x-moon);stroke-width:2;stroke-linejoin:round' }));

          /* centre disc */
          var tm = moonInfo(TODAY);
          svg.appendChild(mk('circle', { cx: KC, cy: KC, r: KDISC, style: 'fill:var(--fill-tertiary);stroke:var(--stroke-secondary);stroke-width:1' }));
          var y0 = tm.eka ? KC - 36 : KC - 26;
          svgText(svg, KC, y0, fmtShort(TODAY), 'font-size:26px;font-weight:600;fill:var(--text-primary)');
          svgText(svg, KC, y0 + 34, 'сегодня · ' + TODAY_N + '/60', 'font-size:17px;fill:var(--text-secondary)');
          svgText(svg, KC, y0 + 58, tm.name, 'font-size:17px;fill:var(--text-secondary)');

          var ekaDays = [], fullDays = [];
          for (var i = 0; i < 60; i++) {
            var n = i + 1, d = WIN[i], key = keyOf(d), isT = n === TODAY_N, future = d > TODAY;
            var p = polar(i + 0.5, KRN), stem = (n - 1) % 10;

            /* notes as dots, stacked inward: mine first, then friends */
            var cols = myNotes(key).map(function () { return ME_COLOR; })
              .concat(future ? [] : friendsOn(key).map(function (e) { return person(e.uid).color; }));
            cols.forEach(function (c, j) {
              var q = polar(i + 0.5, KDOT0 - (isT ? KTR - KNR : 0) - j * KSTEP);

            });

            var g = mk('g', { class: 'elem-' + stem, style: future ? 'opacity:0.5' : '' });
            var ttl = mk('title');

            g.appendChild(ttl);
            var c = mk('circle', {
              cx: f1(p.x), cy: f1(p.y), r: isT ? KTR : KNR,
              style: 'fill:var(--ef);stroke:' + (isT ? 'var(--text-primary)' : 'var(--es)') + ';stroke-width:' + (isT ? 2.6 : 0.8)
            });
            if (isT) c.setAttribute('id', 'k-today-hit');
            g.appendChild(c);
            svgText(g, f1(p.x), f1(p.y) + 0.5, String(n), 'font-size:' + (isT ? 15 : 12.5) + 'px;font-weight:600;fill:var(--et)');
            svg.appendChild(g);

            if (selected && selected.n === n) svg.appendChild(mk('circle', { cx: f1(p.x), cy: f1(p.y), r: (isT ? KTR : KNR) + 5, style: 'fill:none;stroke:var(--text-primary);stroke-width:1.4;stroke-dasharray:3 3' }));
          }

          /* moon markers on the curve */
          for (var m = 0; m < 60; m++) {

            if (mi.ev === 180) {

              svg.appendChild(mk('circle', { cx: f1(fp.x), cy: f1(fp.y), r: 7, style: 'fill:var(--x-moon)' }));
              fullDays.push(fmtDM(WIN[m]));

              ekaDays.push(fmtDM(WIN[m]));
            }
          }

          document.getElementById('k-rings').setAttribute('aria-label',
            'Круг 60 дней с ' + fmtShort(WIN[0]) + ' по ' + fmtShort(WIN[59]) + '. Сегодня ' + TODAY_N + ' из 60, ' + tm.name +
            '. Полнолуние: ' + (fullDays.join(', ') || 'нет') + '. Экадаши: ' + (ekaDays.join(', ') || 'нет') + '.');

          var fdots = PEOPLE.filter(function (p) { return follow[p.id]; }).map(function (p) { return pdot(p); }).join('');
          document.getElementById('k-legend').innerHTML =
            '<span><i class="x-pdot" style="--pc:' + ME_COLOR + ';margin:0"></i>моя запись</span>' +
            (fdots ? '<span><i class="x-lg-dots">' + fdots + '</i>друзья</span>' : '') +
            '<span><i class="x-lg-full"></i>полнолуние</span><span><i class="x-lg-new"></i>новолуние</span><span><i class="x-lg-eka"></i>экадаши</span>';
        }
        function setZoom(z) {
          var sc = document.getElementById('k-scroll');
          var fx = (sc.scrollLeft + sc.clientWidth / 2) / sc.scrollWidth, fy = (sc.scrollTop + sc.clientHeight / 2) / sc.scrollHeight;
          zoom = Math.max(1, Math.min(3, z));
          document.getElementById('k-inner').style.setProperty('--z', zoom);
          sc.style.maxHeight = zoom > 1 ? sc.clientWidth + 'px' : '';
          sc.scrollLeft = fx * sc.scrollWidth - sc.clientWidth / 2;
          sc.scrollTop = fy * sc.scrollHeight - sc.clientHeight / 2;
          document.getElementById('k-zout').disabled = zoom <= 1;
          document.getElementById('k-zin').disabled = zoom >= 3;
        }
        document.getElementById('k-zin').addEventListener('click', function () { setZoom(zoom + 0.9); });
        document.getElementById('k-zout').addEventListener('click', function () { setZoom(zoom - 0.9); });
        document.getElementById('k-open-today').addEventListener('click', function () { openDay(TODAY, { k: TODAY_SLOT.k, n: TODAY_SLOT.n }); });
        document.getElementById('k-inner').addEventListener('click', function (e) {
          var r = document.getElementById('k-rings').getBoundingClientRect();
          var vx = ((e.clientX - r.left) / r.width) * W, vy = ((e.clientY - r.top) / r.height) * H;
          var dx = vx - KC, dy = vy - KC, dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < KDISC + 10 || dist > KRN + 30) return;
          var turn = (Math.atan2(dy, dx) + Math.PI / 2) / (2 * Math.PI);
          var i = ((Math.round(turn * 60 - 0.5) % 60) + 60) % 60;
          openDay(WIN[i], { k: TODAY_SLOT.k, n: i + 1 });
        });

        /* ---------- Bottom sheet ---------- */
        var sheet = document.getElementById('sheet'), scrim = document.getElementById('scrim'), lastFocus = null;
        function openDay(date, slot) {
          var s = slot ? { k: slot.k, n: slot.n, out: false } : slotOf(date);
          var key = keyOf(date), isT = key === keyOf(TODAY), future = date > TODAY;
          var list = entriesOn(key).filter(function (e) { return !e.me; });
          var mn = myNotes(key);
          var ago = addDays(date, -60), agoList = entriesOn(keyOf(ago));
          if (!s.out && current === 'krug') { selected = { k: s.k, n: s.n }; renderKrug(); }
          sheet.innerHTML = '<span class="x-sheet__grab" aria-hidden="true"></span>' +
            '<div class="x-row x-row--between"><p class="x-label">' + slotLabel(s) + '</p><button class="btn" type="button" id="sh-close">Закрыть</button></div>' +
            '<div><h3>' + fmtShort(date) + '</h3><div class="x-day" style="margin-top:8px">' + elemTag(s) + moonTag(date) + (isT ? '<span class="chip chip--solid">Сегодня</span>' : '') + (future ? '<span class="chip">Ещё впереди</span>' : '') + '</div></div>' +
            '<div class="x-card"><p class="x-label">' + (mn.length > 1 ? 'Мои записи · ' + mn.length : 'Моя запись') + '</p>' +
            (mn.length ? mn.map(function (t) { return '<p>' + pdot(user) + esc(t) + '</p>'; }).join('') : '<p class="x-empty">' + (future ? 'День ещё не наступил.' : 'Записи нет.') + '</p>') +
            (isT ? '<div class="links"><button class="btn" type="button" id="sh-write">' + (mn.length ? '+ ещё мысль' : 'Написать') + '</button></div>' : '') + '</div>' +
            (future ? '' : '<div><p class="x-label" style="margin-bottom:10px">Друзья · ' + list.length + '</p>' + (list.length ? entryRows(list) : '<p class="x-empty">Никто из друзей не писал.</p>') + '</div>') +
            '<div class="x-card"><div class="x-row x-row--between"><p class="x-label">60 дней назад</p><span class="pill">' + fmtShort(ago) + '</span></div>' +
            '<div class="x-day">' + moonTag(ago) + '</div>' +
            (agoList.length ? entryRows(agoList) : '<p class="x-empty">В этот день записей нет.</p>') + '</div>';
          lastFocus = document.activeElement;
          sheet.classList.add('is-open'); scrim.classList.add('is-open');
          document.getElementById('sh-close').addEventListener('click', closeSheet);
          var w = document.getElementById('sh-write');
          if (w) w.addEventListener('click', function () { adding = myNotes(keyOf(TODAY)).length > 0; editIdx = -1; show('today'); var ta = document.getElementById('t-text'); if (ta) ta.focus(); });
          document.getElementById('sh-close').focus();
        }
        function closeSheet() {
          if (!sheet.classList.contains('is-open')) return;
          sheet.classList.remove('is-open'); scrim.classList.remove('is-open');
          if (selected) { selected = null; if (current === 'krug') renderKrug(); }
          if (lastFocus && lastFocus.focus) lastFocus.focus();
        }
        scrim.addEventListener('click', closeSheet);
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

        [].forEach.call(document.querySelectorAll('.x-tab'), function (b) {
          b.addEventListener('click', function () { show(b.getAttribute('data-tab')); });
        });

        /* ---------- Splash ---------- */
        var splash = document.getElementById('splash'), sRings = document.getElementById('s-rings'), phone = document.getElementById('phone');
        var splashOpen = true, falling = false;
        var sLine = slotLabel({ k: TODAY_SLOT.k, n: TODAY_SLOT.n }).replace('Кольцо', 'Кольцо') + ' · ' + fmtShort(TODAY);
        document.getElementById('s-line').textContent = sLine;
        sRings.setAttribute('aria-label', 'Войти в CENTRAL. Сегодня: ' + sLine);

        Ripple.origin = function () {
          if (falling) return null;
          if (splashOpen) return document.getElementById('s-today-hit');
          if (current === 'krug' && !sheet.classList.contains('is-open')) return document.getElementById('k-today-hit');
          return null;
        };
        Ripple.clip = function () {
          if (splashOpen) return null;
          var r = phone.getBoundingClientRect();
          return 'inset(' + Math.max(0, r.top) + 'px ' + Math.max(0, window.innerWidth - r.right) + 'px ' + Math.max(0, window.innerHeight - r.bottom) + 'px ' + Math.max(0, r.left) + 'px round 32px)';
        };

        function enter() {
          if (falling || !splashOpen) return;
          falling = true;
          Ripple.stop();
          var p = nodeXY(TODAY_SLOT.k, TODAY_SLOT.n - 1);
          sRings.style.transformOrigin = (p.x / 7.2) + '% ' + (p.y / 7.2) + '%';
          splash.classList.add('is-falling');
          setTimeout(function () {
            splash.hidden = true;
            splash.classList.remove('is-falling');
            splashOpen = false; falling = false;
            phone.hidden = false;
            phone.classList.remove('is-entering'); void phone.offsetWidth; phone.classList.add('is-entering');
            show(user ? 'today' : 'reg');
          }, REDUCED ? 220 : 800);
        }
        function openSplash() {
          closeSheet();
          splash.hidden = false; splashOpen = true;
          sRings.focus();
          Ripple.kick();
        }
        sRings.addEventListener('click', enter);
        sRings.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); enter(); } });

        buildSixRings('s');
        initFullscreenRipples();
      })();
    </script>
  </body>
</html>
